name: Tag

on:
  push:
    branches:
      - main
    paths:
      - app/build.gradle.kts
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create, for example v1.0.1. Leave empty to use app versionName."
        required: false
        type: string
      ref:
        description: "Commit, branch, or tag to tag. Leave empty to use the workflow ref."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create tag and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ inputs.tag_name }}"
          TARGET_REF="${{ inputs.ref }}"

          if [[ -z "$TAG_NAME" ]]; then
            VERSION_NAME="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
            if [[ -z "$VERSION_NAME" ]]; then
              echo "Could not find versionName in app/build.gradle.kts" >&2
              exit 1
            fi
            TAG_NAME="v${VERSION_NAME}"
          fi

          if ! git check-ref-format "refs/tags/${TAG_NAME}"; then
            echo "Invalid tag name: ${TAG_NAME}" >&2
            exit 1
          fi

          if [[ -z "$TARGET_REF" ]]; then
            TARGET_REF="$GITHUB_SHA"
          fi

          TARGET_SHA="$(git rev-parse "${TARGET_REF}^{commit}")"

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ steps.resolve.outputs.tag_name }}"
          TARGET_SHA="${{ steps.resolve.outputs.target_sha }}"

          git fetch --tags origin

          EXISTING_SHA="$(git rev-parse -q --verify "refs/tags/${TAG_NAME}^{commit}" || true)"
          if [[ -n "$EXISTING_SHA" ]]; then
            if [[ "$EXISTING_SHA" == "$TARGET_SHA" ]]; then
              echo "Tag ${TAG_NAME} already points to ${TARGET_SHA}; nothing to do."
              exit 0
            fi
            echo "Tag ${TAG_NAME} already exists at ${EXISTING_SHA}, not ${TARGET_SHA}." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "Release ${TAG_NAME}"
          git push origin "$TAG_NAME"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Build APK
        shell: bash
        run: ./gradlew :app:assembleDebug

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ steps.resolve.outputs.tag_name }}"
          mkdir -p release

          APK_NAME="WeChatAssistant-${TAG_NAME}.apk"
          CHANGELOG_NAME="WeChatAssistant-${TAG_NAME}-changelog.txt"
          cp app/build/outputs/apk/debug/app-debug.apk "release/${APK_NAME}"
          (cd release && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")

          PREVIOUS_TAG="$(git tag --sort=-creatordate | grep -v "^${TAG_NAME}$" | head -n 1 || true)"
          {
            echo "WeChatAssistant ${TAG_NAME}"
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo "Built at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "Changes since ${PREVIOUS_TAG}:"
              git log --oneline --no-decorate "${PREVIOUS_TAG}..HEAD"
            else
              echo "Changes:"
              git log --oneline --no-decorate HEAD
            fi
          } > "release/${CHANGELOG_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --notes-file "release/WeChatAssistant-${TAG_NAME}-changelog.txt"
            gh release upload "$TAG_NAME" release/* --clobber
          else
            gh release create "$TAG_NAME" release/* \
              --title "$TAG_NAME" \
              --notes-file "release/WeChatAssistant-${TAG_NAME}-changelog.txt"
          fi
